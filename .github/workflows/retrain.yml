name: Model Retrain Pipeline

on:
  schedule:
    - cron: '0 2 * * *'  # daily at 02:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-workflow.txt

      - name: Validate required secrets
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: |
          if [ -z "${HOPSWORKS_API_KEY}" ]; then
            echo "::error::HOPSWORKS_API_KEY is missing. Add it to GitHub repository secrets before the retraining job runs."
            exit 1
          fi

      - name: Show workflow requirements file (debug)
        run: |
          echo "=== requirements-workflow.txt ==="
          cat requirements-workflow.txt || true

      - name: Install dependencies (uninstall old versions first, no cache)
        run: |
          python -m pip install --upgrade pip
          # Uninstall potentially preinstalled older packages to avoid mismatches
          python -m pip uninstall -y hopsworks hsml hsfs || true
          # Install from workflow-specific requirements without using pip cache to avoid stale wheels
          python -m pip install --upgrade -r requirements-workflow.txt --no-cache-dir
          # Force-install matching hopsworks client for backend (pin to resolvable series)
          python -m pip install --upgrade --no-cache-dir "hopsworks==5.0.*"

      - name: Verify dependencies (show installed versions)
        run: |
          python - <<'PY'
import importlib
mods = ['hopsworks','hsml','hsfs','joblib','numpy','pandas','requests','sklearn']
print('Dependencies loaded successfully')
for m in mods:
    try:
        mod = importlib.import_module(m)
        print(m + ':', getattr(mod, '__version__', None))
    except Exception as e:
        print(m + ': import failed ->', e)
PY
          python -m pip show hopsworks hsml hsfs || true

      - name: Run retraining script
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: |
          python retrain.py

      - name: Upload retraining artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-artifacts
          path: retrain_artifacts/**

  notify:
    needs: retrain
    runs-on: ubuntu-latest
    env:
      GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - name: Check Gmail secrets and skip if missing
        run: |
          if [ -z "${GMAIL_USERNAME}" ] || [ -z "${GMAIL_APP_PASSWORD}" ]; then
            echo "Gmail secrets not set; skipping notification job."
            exit 0
          fi
      - name: Send Gmail notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "AQI retraining workflow: ${{ needs.retrain.result }}"
          to: 70169383@student.uol.edu.pk
          from: "AQI Retraining <${{ secrets.GMAIL_USERNAME }}>"
          body: |
            The AQI model retraining workflow finished with status: ${{ needs.retrain.result }}.
            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
